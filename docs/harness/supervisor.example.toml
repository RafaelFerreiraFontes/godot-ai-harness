# Exemplo de configuração do supervisor 02C (docs/harness/autonomous-orchestration-02c.md).
#
# ATENÇÃO: os argv abaixo foram montados a partir de `--help` (claude 2.1.326, codex-cli
# 0.169.0, agy 1.5.10) e NÃO foram executados contra provedores reais. Confira cada CLI,
# modelo e permissão antes do primeiro `run --execute`. O supervisor recusa flags de bypass,
# shells, shims .cmd/.bat e variáveis de ambiente sensíveis; não há fallback entre provedores.
# Placeholders aceitos em args: {model} {role} {task_id} {cwd} {prompt} {prompt_file}.
# `claude -p` não consegue pedir confirmação: libere ferramentas conscientemente (--allowedTools)
# por papel, se necessário. Nenhum caminho pessoal ou credencial deve entrar neste arquivo.

[run]
max_iterations = 2          # retornos Reviewer/QA/Gate -> Code antes de ITERATION_LIMIT_EXCEEDED
max_attempts = 2            # tentativas por passo para falhas classificadas
retry_on = ["timeout", "process_failed"]

[agents.coordenador]
provider = "claude"
executable = "claude"
model = "claude-opus-5-5"
args = ["-p", "--model", "{model}", "--agent", "coordenador", "--output-format", "json", "--permission-mode", "default"]
prompt_via = "stdin"
timeout_seconds = 1800

[agents.orquestrador]
provider = "codex"
executable = "codex"
model = "gpt-6.1-terra"
args = ["exec", "-m", "{model}", "-s", "read-only", "-C", "{cwd}", "-"]
prompt_via = "stdin"
timeout_seconds = 1800

[agents.code]
provider = "claude"
executable = "claude"
model = "claude-sonnet-5-5"
args = ["-p", "--model", "{model}", "--agent", "code", "--output-format", "json", "--permission-mode", "default"]
prompt_via = "stdin"
timeout_seconds = 3600
# Obrigatório para Code: globs (relativos, com /) dos arquivos exclusivos da tarefa.
ownership = ["REPLACE_WITH_TASK_GLOBS/*"]

[agents.reviewer]
provider = "codex"
executable = "codex"
model = "gpt-6.1-sol"
args = ["exec", "-m", "{model}", "-s", "read-only", "-C", "{cwd}", "-"]
prompt_via = "stdin"
timeout_seconds = 1800

[agents.qa]
provider = "antigravity"
executable = "agy"
model = "gemini-3.8-flash-medium"
# Entrada não interativa do agy via argumento (stdin não verificado). Verifique --agent/--mode.
args = ["--print", "{prompt}", "--model", "{model}", "--agent", "qa", "--mode", "plan", "--output-format", "text"]
prompt_via = "arg"
timeout_seconds = 1800
# QA só pode tocar caches declarados aqui (ignorados pelo Git normalmente não aparecem).
ownership = []

[agents.gate]
provider = "antigravity"
executable = "agy"
model = "gemini-4-hydrogen-medium"
args = ["--print", "{prompt}", "--model", "{model}", "--agent", "gate", "--mode", "plan", "--output-format", "text"]
prompt_via = "arg"
timeout_seconds = 1800
